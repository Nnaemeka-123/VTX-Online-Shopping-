<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VTXOnline Shopping</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="">
<style>
:root{--g:#111111;--gd:#000000;--ink:#303030;--mut:#616161;--line:#e3e3e3;--bg:#f3f3f1;--card:#fff;--top:#0a0a0a;--red:#c70a24;--blue:#005bd3;--r:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{font-size:20px;line-height:28px;margin:0;font-weight:650}
h2{font-size:15px;margin:0 0 4px;font-weight:650}
h3{font-size:14px;margin:0;font-weight:650}
p{margin:0}
.mut{color:var(--mut)}.sm{font-size:12px}.b{font-weight:650}.right{text-align:right}.grow{flex:1;min-width:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* top bar */
.top{position:sticky;top:0;z-index:30;height:56px;background:var(--top);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:650;font-size:15px;white-space:nowrap}
.logo:hover{text-decoration:none}
.logo img{width:32px;height:32px;border-radius:8px;background:#fff;object-fit:cover}
.search{flex:1;max-width:520px;margin:0 auto;position:relative}
.search input{width:100%;height:36px;border-radius:10px;border:0;background:#303030;color:#fff;padding:0 12px 0 36px}
.search input::placeholder{color:#b5b5b5}
.search svg{position:absolute;left:10px;top:8px;width:20px;height:20px;color:#b5b5b5}
.tbtn{position:relative;background:none;border:0;color:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.tbtn:hover{background:#303030}
.cnt{position:absolute;top:3px;right:2px;background:var(--g);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:650}
.avatar{width:32px;height:32px;border-radius:50%;background:#e3e3e3;color:#303030;display:grid;place-items:center;font-weight:650;font-size:12px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.signin{background:#fff;color:#1a1a1a;border-radius:10px;padding:7px 12px;font-weight:600;border:0;cursor:pointer}
/* layout */
.layout{display:flex;min-height:calc(100vh - 56px)}
.side{width:236px;flex:none;padding:12px 8px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink);font-weight:550;margin-bottom:2px;position:relative}
.nav:hover{background:#e8e8e8;text-decoration:none}
.nav.on{background:#fff;box-shadow:0 1px 0 rgba(26,26,26,.07),0 0 0 1px rgba(0,0,0,.05)}
.nav .cnt{position:static;margin-left:auto}
.nav-sep{font-size:12px;color:var(--mut);padding:14px 10px 6px;font-weight:550}
main{flex:1;min-width:0;padding:20px 24px 60px}
.wrap{max-width:1040px;margin:0 auto}
.bottom{display:none}
@media(max-width:900px){
 .side{display:none}
 main{padding:14px 12px 96px}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 0;position:relative;font-weight:550}
 .bottom a.on{color:var(--g)}.bottom a:hover{text-decoration:none}
 .bottom .cnt{top:0;right:calc(50% - 22px)}
 .logo span{display:none}
 .hide-m{display:none}
}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 0 rgba(26,26,26,.07),0 0 0 1px rgba(0,0,0,.05);padding:16px;margin-bottom:16px}
.card.flush{padding:0;overflow:hidden}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h .grow{min-width:120px}
.row{display:flex;align-items:center;gap:12px}
.row.wrap2{flex-wrap:wrap}
.gap8{gap:8px}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
@media(max-width:600px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2.keep{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(2,1fr);gap:10px}}
.hr{height:1px;background:var(--line);margin:12px 0;border:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);color:inherit}
.item:last-child{border-bottom:0}
a.item:hover{background:#fafafa;text-decoration:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:0;background:#fff;color:var(--ink);font-weight:600;cursor:pointer;box-shadow:inset 0 -1px 0 rgba(0,0,0,.2),inset 0 0 0 1px rgba(0,0,0,.1);white-space:nowrap}
.btn:hover{background:#fafafa;text-decoration:none}
.btn.p{background:#303030;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn.p:hover{background:#1a1a1a}
.btn.g{background:var(--g);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn.g:hover{background:var(--gd)}
.btn.d{color:var(--red)}
.btn.lg{height:40px;padding:0 18px;font-size:14px;border-radius:10px}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg.i{width:16px;height:16px}
/* forms */
label.f{display:block;font-size:13px;font-weight:550;margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px}
.in,select.in,textarea.in{width:100%;min-height:34px;padding:6px 10px;border-radius:8px;border:1px solid #8a8a8a;background:#fff}
.in:hover{background:#fafafa}
.in:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
textarea.in{min-height:90px;resize:vertical}
.hint{font-size:12px;color:var(--mut);margin-top:4px;font-weight:400}
/* badges */
.bd{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:8px;font-size:12px;font-weight:550;background:#e3e3e3;color:#303030;white-space:nowrap}
.bd.ok{background:#cdfee1;color:#0c5132}.bd.wa{background:#ffeb78;color:#4f4700}.bd.cr{background:#fedad9;color:#8e0b21}.bd.in{background:#a4e8f2;color:#00434e}
.up{color:#0c5132}.dn{color:#8e0b21}
/* banners */
.ban{display:flex;gap:10px;padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:13px;background:#eaf4ff;color:#00284f}
.ban.wa{background:#fff5ea;color:#4a2b00}.ban.ok{background:#e0f5ec;color:#0c5132}.ban.cr{background:#fff1f0;color:#8e0b21}
/* hero */
.hero{background:#1a1a1a;color:#fff;border-radius:16px;padding:24px;display:flex;align-items:center;gap:20px;margin-bottom:16px;overflow:hidden;position:relative}
.hero img{width:132px;height:132px;border-radius:18px;background:#fff;object-fit:cover;flex:none}
.hero h1{font-size:26px;line-height:32px;margin-bottom:6px}
.hero p{color:#c9c9c9;margin-bottom:14px;max-width:46ch}
@media(max-width:600px){.hero{flex-direction:column;align-items:flex-start;padding:18px}.hero img{width:84px;height:84px}.hero h1{font-size:21px;line-height:27px}}
.stat{padding:14px 16px}.stat .n{font-size:22px;font-weight:650;margin-top:2px}
/* product cards */
.pc{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 0 rgba(26,26,26,.07),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column}
.pc .im{aspect-ratio:1;background:#f1f1f1;display:block}
.pc .im img{width:100%;height:100%;object-fit:cover;display:block}
.pc .bd2{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.pc .nm{font-weight:600;color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .pr{font-weight:650}
.pc .btn{margin-top:8px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#f1f1f1;flex:none;border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:0;background:#e3e3e3;border-radius:8px;padding:5px 12px;font-weight:550;cursor:pointer;white-space:nowrap}
.chip.on{background:#303030;color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tab{background:none;border:0;padding:8px 12px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--ink)}
/* product page */
.pp{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:700px){.pp{grid-template-columns:1fr}}
.pp .main{aspect-ratio:1;border-radius:12px;background:#f1f1f1;width:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs img{width:60px;height:60px;border-radius:8px;object-fit:cover;cursor:pointer;border:2px solid transparent}
.thumbs img.on{border-color:var(--ink)}
.qty{display:inline-flex;align-items:center;border:1px solid #8a8a8a;border-radius:8px;overflow:hidden}
.qty button{width:32px;height:32px;border:0;background:#fff;cursor:pointer;font-size:16px}
.qty span{min-width:30px;text-align:center;font-weight:600}
/* progress */
.bar{height:6px;border-radius:3px;background:#e3e3e3;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.dot{width:22px;height:22px;border-radius:50%;border:2px dashed #8a8a8a;flex:none;display:grid;place-items:center;margin-top:1px}
.dot.done{background:#303030;border:0;color:#fff}.dot svg{width:13px;height:13px;stroke-width:3}
/* chart */
.chartwrap{position:relative;height:340px}
#chart{width:100%;height:100%;display:block}
.tip{position:absolute;pointer-events:none;background:#1a1a1a;color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;display:none;z-index:2;min-width:130px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;font-weight:550;font-size:12px}
.lg i{width:9px;height:9px;border-radius:50%}.lg.off{opacity:.4}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--g)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.live i{animation:none}}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.modal .mh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:650}
.modal .mb{padding:16px}.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#303030;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:550;display:none;max-width:90vw;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#toast.err{background:#8e0b21}
/* auth */
.authw{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f1f1f1}
.authc{width:100%;max-width:400px}
.authc .lg0{text-align:center;margin-bottom:16px}
.authc .lg0 img{width:84px;height:84px;border-radius:20px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.1)}
.pay{background:#f7f7f7;border-radius:10px;padding:12px;border:1px dashed #b5b5b5}
.pay .l{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.chip2{display:inline-flex;align-items:center;gap:8px}
.proof{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);margin-top:8px}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.empty h2{color:var(--ink)}
.pl{display:inline-block;padding:2px 8px;border-radius:6px;background:#f1f1f1;font-size:11px;font-weight:600;color:#616161}
.search kbd{position:absolute;right:8px;top:8px;font:11px/1 inherit;background:#424242;color:#b5b5b5;border-radius:5px;padding:4px 6px}
.chipstore{display:flex;align-items:center;gap:8px;color:#fff;font-weight:550;padding:4px 10px 4px 4px;border-radius:10px;background:#303030;max-width:200px}
.chipstore:hover{background:#3a3a3a;text-decoration:none}.chipstore span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav svg.i{color:#5c5f62}.nav.on svg.i{color:#1a1a1a}

/* VTX black and silver theme */
body{background:var(--bg)}
.top{background:linear-gradient(180deg,#141414,#0a0a0a);border-bottom:1px solid #2a2a2a}
.logo{letter-spacing:.06em}
.tbtn .cnt,.top .cnt{background:#e6e7e9;color:#111}
.side{background:#ecece9;border-right:1px solid #dcdcd8}
.nav:hover{background:#e0e0dc}
.nav.on{background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.08)}
.nav.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:2px;background:linear-gradient(180deg,#111,#8f9296)}
.btn.p,.btn.g{background:linear-gradient(180deg,#3b3b3b,#111);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(0,0,0,.3)}
.btn.p:hover,.btn.g:hover{background:linear-gradient(180deg,#4a4a4a,#1a1a1a)}
.btn{background:linear-gradient(180deg,#fff,#f1f1f0)}
.hero{background:linear-gradient(120deg,#070707 0%,#1c1c1c 55%,#5a5c5f 100%);border:1px solid #2a2a2a}
.hero::after{content:"";position:absolute;right:12%;top:-30%;width:90px;height:170%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:rotate(22deg);pointer-events:none}
.hero h1{letter-spacing:-.01em;background:linear-gradient(180deg,#fff,#b9bcc0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero img{box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.bar i{background:linear-gradient(90deg,#111,#8f9296)}
.dot.done{background:#111}
.chip.on{background:#111}
.tab.on{border-color:#111}
.authw{background:radial-gradient(circle at 50% 0%,#fff,#e9e9e6)}
.authc .lg0 img{box-shadow:0 4px 18px rgba(0,0,0,.15)}
.pc .im{background:#ecece9}
.card{box-shadow:0 1px 0 rgba(26,26,26,.06),0 0 0 1px rgba(0,0,0,.06)}
.stat .n{letter-spacing:-.01em}
.ban{background:#efefed;color:#1a1a1a}
.live{color:#111}.live i{background:#111}

.spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
button.nav{width:100%;border:0;background:none;text-align:left;font:inherit;font-weight:550;cursor:pointer}
.annc{background:#111;color:#fff;text-align:center;padding:8px 12px;font-size:13px;font-weight:550}
.bannerimg{width:100%;height:160px;object-fit:cover;display:block}
.ph0{background:linear-gradient(120deg,#070707,#1c1c1c 55%,#6a6c70)}
.aibtn{position:fixed;right:18px;bottom:22px;z-index:45;width:52px;height:52px;border-radius:50%;border:0;color:#fff;background:linear-gradient(180deg,#3b3b3b,#0a0a0a);box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);display:grid;place-items:center;cursor:pointer}
.aip{position:fixed;right:18px;bottom:84px;z-index:50;width:390px;max-width:calc(100vw - 24px);height:min(580px,calc(100vh - 110px));background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.aip[hidden]{display:none}
.aih{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(120deg,#070707,#262626 60%,#5a5c5f);color:#fff}
.aih img{width:32px;height:32px;border-radius:8px;background:#fff;object-fit:cover}.aih .tbtn{width:32px;height:32px}
.aim{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f6f6f4}
.am{max-width:88%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.5}
.am.a{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.07);align-self:flex-start;border-bottom-left-radius:4px}
.am.u{background:#111;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.aibtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.aiq{display:flex;gap:6px;overflow:auto;padding:8px 12px;border-top:1px solid var(--line)}
.aiq .chip{font-size:12px;padding:4px 10px}
.aif{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
@media(max-width:900px){.aibtn{bottom:88px;right:14px;width:48px;height:48px}.aip{left:8px;right:8px;bottom:8px;top:64px;width:auto;max-width:none;height:auto}}
.usd{display:block;font-size:12px;color:var(--mut);font-weight:500}
.b.right .usd,.right .usd{text-align:right}
.logo-anim{animation:logoPulse 1.7s ease-in-out infinite;transform-origin:center}
@keyframes logoPulse{0%,100%{transform:scale(.8);opacity:.85;filter:drop-shadow(0 3px 5px rgba(0,0,0,.12))}50%{transform:scale(1.18);opacity:1;filter:drop-shadow(0 18px 24px rgba(0,0,0,.38))}}
@media(prefers-reduced-motion:reduce){.logo-anim{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status"></div>
<div id="ai"></div>
<script>

function detectDemo(){return fetch('/api').then(function(r){if(r.ok)return r.json().then(function(j){return !(j&&j.ok)},function(){return true});return r.status===404||r.status===405}).catch(function(){return false})}
function installDemo(){
 if(window.__DEMO)return;window.__DEMO=true;
 const process={env:{PAYSTACK_SECRET_KEY:'demo',PAYSTACK_PUBLIC_KEY:'demo'}};
 const wcrypto=window.crypto;
 class Buf extends Uint8Array{
  static from(x,enc){let b;if(typeof x==='string'){if(enc==='hex'){b=new Uint8Array(x.length/2);for(let i=0;i<b.length;i++)b[i]=parseInt(x.substr(i*2,2),16)}else if(enc==='base64'||enc==='base64url'){let s=x.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);b=Uint8Array.from(bin,c=>c.charCodeAt(0))}else b=new TextEncoder().encode(x)}else b=x;const r=new Buf(b.length);r.set(b);return r}
  toString(enc){if(enc==='hex')return Array.from(this).map(v=>v.toString(16).padStart(2,'0')).join('');if(enc==='base64'||enc==='base64url'){let bin='';this.forEach(v=>{bin+=String.fromCharCode(v)});const s=btoa(bin);return enc==='base64url'?s.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''):s}return new TextDecoder().decode(this)}
 }

class DB {
  constructor(st) { this.st = st; this.d = {}; this.dirty = new Set(); }
  async get(k, def) { if (!(k in this.d)) { const v = await this.st.get(k, { type: 'json' }); this.d[k] = v ?? def; } return this.d[k]; }
  col(k) { return this.get(k, []); }
  mark(k) { this.dirty.add(k); }
  async flush() {
    if (!this.dirty.size) return;
    const meta = await this.get('meta', {});
    if (this.dirty.has('brands') || this.dirty.has('products')) {
      const all = [...(await this.col('brands')), ...(await this.col('products'))].filter(x => x.status === 'publishing').map(x => x.publishAt || 0);
      meta.nextAt = all.length ? Math.min(...all) : 0;
    }
    meta.v = (meta.v || 0) + 1;
    this.dirty.add('meta');
    for (const k of this.dirty) await this.st.setJSON(k, this.d[k]);
    this.dirty.clear();
  }
}

const b64 = s => Buffer.from(s).toString('base64url');
async function signToken(db, uid) {
  const { s } = await db.get('secret', null);
  const p = uid + '.' + (Date.now() + 30 * 864e5);
  return b64(p) + '.' + crypto.createHmac('sha256', s).update(p).digest('hex');
}
async function authUser(req, db) {
  const h = req.headers.get('authorization') || '';
  if (!h.startsWith('Bearer ')) return null;
  const [pb, sig] = h.slice(7).split('.');
  if (!pb || !sig) return null;
  let p; try { p = Buffer.from(pb, 'base64url').toString(); } catch (e) { return null; }
  const { s } = await db.get('secret', null);
  const good = crypto.createHmac('sha256', s).update(p).digest('hex');
  if (good.length !== sig.length || !crypto.timingSafeEqual(Buffer.from(good), Buffer.from(sig))) return null;
  const [uid, exp] = p.split('.');
  if (Date.now() > Number(exp)) return null;
  return (await db.col('users')).find(u => u.id === uid) || null;
}

async function sweep(db, now) {
  const brands = await db.col('brands'), prods = await db.col('products');
  brands.forEach(b => { if (b.status === 'publishing' && (b.publishAt || 0) <= now) { b.status = (b.name && b.description) ? 'active' : 'draft'; db.mark('brands'); } });
  prods.forEach(p => {
    if (p.status === 'publishing' && (p.publishAt || 0) <= now) {
      const why = !(p.images && p.images.length) ? 'Add at least one real photo.' : !(p.price > 0) ? 'Set a price above 0.' : (p.description || '').trim().length < 10 ? 'Write a longer description (10+ characters).' : '';
      if (why) { p.status = 'draft'; p.note = why; } else { p.status = 'active'; p.note = ''; }
      db.mark('products');
    }
  });
}
async function tick(db, now) {
  const meta = await db.get('meta', {}), series = await db.get('series', {}), brands = await db.col('brands');
  const steps = Math.max(1, Math.min(6, Math.floor((now - (meta.lastTick || 0)) / 12000)));
  meta.bump = meta.bump || {};
  const live = brands.filter(b => b.status === 'active');
  for (let s = 0; s < steps; s++) {
    live.forEach(b => {
      let a = series[b.id];
      if (!a) { let v = 70 + Math.random() * 60; a = []; for (let i = 0; i < N; i++) { v = Math.max(10, v * (1 + (Math.random() - .5) * .05)); a.push(+v.toFixed(2)); } series[b.id] = a; }
      const bump = meta.bump[b.id] || 0, last = a[a.length - 1];
      a.push(+Math.max(5, last * (1 + (Math.random() - .5) * .04 + bump * .01)).toFixed(2)); if (a.length > N) a.shift();
      meta.bump[b.id] = bump * .7;
    });
  }
  Object.keys(series).forEach(id => { if (!live.some(b => b.id === id)) delete series[id]; });
  meta.lastTick = now; db.mark('series'); db.mark('meta');
}

async function paystackVerify(ref) {
  const key = process.env.PAYSTACK_SECRET_KEY; if (!key) bad('Online payment is not set up yet.', 503);
  let r; try { r = await fetch('https://api.paystack.co/transaction/verify/' + encodeURIComponent(ref), { headers: { authorization: 'Bearer ' + key } }); } catch (e) { bad('Could not reach the payment provider. Try again.', 502); }

async function fulfill(db, ref, u) {
  const now = Date.now();
  if (ref.startsWith('VTXO-')) {
    const orders = await db.col('orders'); let mine = orders.filter(o => o.payRef === ref);
    if (u) mine = mine.filter(o => o.buyerId === u.id);
    if (!mine.length) return { paid: false, error: 'Order not found.' };
    if (mine.every(o => !['verifying', 'cancelled'].includes(o.status))) return { paid: true, already: true };
    const data = await paystackVerify(ref);
    if (!data || data.status !== 'success') return { paid: false, status: data ? data.status : 'unknown' };
    const expected = Math.round(mine.reduce((a, o) => a + o.subtotal, 0) * 100);
    if (data.currency !== 'NGN' || data.amount < expected) return { paid: false, error: 'The amount paid does not match the order.' };
    const prods = await db.col('products'), meta = await db.get('meta', {}); meta.bump = meta.bump || {};
    mine.forEach(o => {
      if (o.status === 'cancelled') o.items.forEach(i => { const p = prods.find(x => x.id === i.pid); if (p) p.stock = Math.max(0, p.stock - i.qty); });
      if (['verifying', 'cancelled'].includes(o.status)) {
        o.status = 'paid'; o.paidAt = now; o.payMethod = 'Paystack'; o.payTx = String(data.id || ''); o.note = '';
        meta.bump[o.brandId] = (meta.bump[o.brandId] || 0) + Math.min(8, 2 + o.subtotal / 20000);
      }
    });
    db.mark('orders'); db.mark('products'); db.mark('meta'); return { paid: true };
  }
  if (ref.startsWith('VTXF-')) {
    const pays = await db.col('payments'); const p = pays.find(x => x.reference === ref && (!u || x.userId === u.id));
    if (!p) return { paid: false, error: 'Payment not found.' };
    if (p.status === 'approved') return { paid: true, already: true };
    const data = await paystackVerify(ref);
    if (!data || data.status !== 'success') return { paid: false, status: data ? data.status : 'unknown' };
    if (data.currency !== 'NGN' || data.amount < Math.round(p.amount * 100)) return { paid: false, error: 'The amount paid does not match the listing fee.' };
    p.status = 'approved'; p.paidAt = now; p.payTx = String(data.id || '');
    const b = (await db.col('brands')).find(x => x.id === p.brandId);
    if (b && ['unpaid', 'rejected', 'pending'].includes(b.status)) { b.status = 'publishing'; b.publishAt = now + 3000; db.mark('brands'); }
    db.mark('payments'); return { paid: true };
  }
  return { paid: false, error: 'Unknown reference.' };
}

async function ensureCredits(db, userId) {
  const brandIds = (await db.col('brands')).filter(b => b.ownerId === userId).map(b => b.id);
  if (!brandIds.length) return;
  const orders = await db.col('orders'), led = await db.col('ledger'); let ch = false;
  orders.forEach(o => {
    if (brandIds.includes(o.brandId) && o.status === 'delivered' && !o.payoutDone && !led.some(l => l.orderId === o.id)) {
      led.push({ id: rid('l_'), userId, type: 'credit', orderId: o.id, amount: o.payout, created: Date.now(), note: 'Order ' + o.id }); ch = true;
    }
  });

function walletSummary(led, orders, brandIds, userId) {
  const mine = led.filter(l => l.userId === userId);
  const credits = r2(mine.filter(l => l.type === 'credit').reduce((a, l) => a + l.amount, 0));
  const live = mine.filter(l => l.type === 'withdrawal' && l.status !== 'rejected');
  const out = r2(live.reduce((a, l) => a + l.amount, 0));
  return {
    available: r2(credits - out), earned: credits,
    withdrawn: r2(mine.filter(l => l.type === 'withdrawal' && l.status === 'paid').reduce((a, l) => a + l.amount, 0)),
    held: r2(mine.filter(l => l.type === 'withdrawal' && l.status === 'pending').reduce((a, l) => a + l.amount, 0)),
    pending: r2(orders.filter(o => brandIds.includes(o.brandId) && ['paid', 'shipped'].includes(o.status)).reduce((a, o) => a + o.payout, 0))
  };

    case 'pos.sale': {

      if (!b || b.status !== 'active') bad('Your store must be Active to use the POS.');
      const prods = await db.col('products'), sales = await db.col('possales');
      const cid = str(body.cid, 40); if (!/^[A-Za-z0-9_-]{6,40}$/.test(cid)) bad('Bad sale id.');
      const dup = sales.find(s => s.id === cid); if (dup) return { sale: dup, dup: true };
      const items = (Array.isArray(body.items) ? body.items : []).slice(0, 100).map(i => {
        const p = prods.find(x => x.id === i.pid && x.brandId === b.id); if (!p) bad('An item in this sale no longer exists.');
        const qty = Math.floor(num(i.qty)); if (qty < 1) bad('Invalid quantity.');
        return { pid: p.id, name: p.name, price: Math.max(0, r2(num(i.price))), cost: p.cost || 0, qty };
      });
      if (!items.length) bad('The sale is empty.');
      const sub = r2(items.reduce((a, i) => a + i.price * i.qty, 0));
      const d = body.disc || {}; const dv = Math.max(0, num(d.value));
      const disc = r2(d.type === 'amt' ? Math.min(sub, dv) : sub * Math.min(100, dv) / 100);
      const net = r2(sub - disc), vat = r2(net * (b.posVat || 0) / 100), total = r2(net + vat);
      const tenders = (Array.isArray(body.tenders) ? body.tenders : []).slice(0, 6).map(t => ({ method: ['Cash', 'Transfer', 'Card'].includes(t.method) ? t.method : 'Cash', amount: Math.max(0, r2(num(t.amount))), ref: str(t.ref, 80) })).filter(t => t.amount > 0);
      const paid = r2(tenders.reduce((a, t) => a + t.amount, 0));
      if (paid < total - 0.01) bad('Payment is less than the total.');
      let no = str(body.no, 20); if (!/^POS-[A-Z0-9]{4,14}$/.test(no) || sales.some(s => s.no === no)) no = 'POS-' + crypto.randomBytes(4).toString('hex').toUpperCase();
      let t = num(body.time) || now; if (t > now || t < now - 7 * 864e5) t = now;
      const cu = body.cust || {};
      const sale = { id: cid, no, brandId: b.id, cashierId: u.id, cashier: u.name, time: t, items, sub, disc, vat, total, tenders, tendered: Math.max(0, r2(num(body.tendered))) || paid, change: Math.max(0, r2(num(body.change))), cust: { name: str(cu.name, 60), phone: str(cu.phone, 30) }, note: str(body.note, 120), status: 'paid' };
      items.forEach(i => { const p = prods.find(x => x.id === i.pid); p.stock = Math.max(0, p.stock - i.qty); });
      sales.push(sale);
      const m = await db.get('meta', {}); m.bump = m.bump || {}; m.bump[b.id] = (m.bump[b.id] || 0) + Math.min(6, 1 + total / 20000);
      db.mark('possales'); db.mark('products'); db.mark('meta');
      return { sale };
    }
    case 'pos.refund': {
      need(u); const sales = await db.col('possales'), s = sales.find(x => x.id === body.id); if (!s) bad('Sale not found.', 404);
      const b = (await db.col('brands')).find(x => x.id === s.brandId);
      if (u.role !== 'admin' && b?.ownerId !== u.id) bad('Not your sale.', 403);
      if (s.status === 'refunded') return { sale: s };
      s.status = 'refunded'; s.refundedBy = u.name; s.refundedAt = now;
      const prods = await db.col('products'); s.items.forEach(i => { const p = prods.find(x => x.id === i.pid); if (p) p.stock += i.qty; });
      db.mark('possales'); db.mark('products'); return { sale: s };
    }
    case 'pos.settings': {
      need(u); const b = await myBrandOf(db, u); if (!b) bad('Create your store first.');
      b.posVat = Math.min(100, Math.max(0, num(body.vat))); b.posFooter = str(body.footer, 120); b.posAddress = str(body.address, 160); b.posPhone = str(body.phone, 30);
      const a = body.account || {}; b.posAccount = { name: str(a.name, 80), bank: str(a.bank, 40), number: str(a.number, 20) };
      db.mark('brands'); return { ok: 1 };
    }
    case 'migrate': {
      needAdmin(u); const c = body.c, recs = (Array.isArray(body.recs) ? body.recs : []).slice(0, 40);
      const clean = o => { const r = { ...o }; for (const k of ['logo', 'banner', 'proof']) if (r[k] && !okImg(r[k])) r[k] = ''; if (Array.isArray(r.images)) r.images = r.images.filter(okImg); return r; };
      if (c === 'settings') {
        const s = await db.get('settings', {}), r = recs[0] || {};
        if (r.account) s.account = { name: str(r.account.name, 80), bank: str(r.account.bank, 40), number: str(r.account.number, 20) };
        if (r.fee >= 0) s.fee = num(r.fee); if (r.commission >= 0 && r.commission <= 1) s.commission = num(r.commission);
        db.mark('settings'); return { ok: 1 };
      }
      if (!['brands', 'products', 'users', 'orders', 'payments', 'discounts', 'connections'].includes(c)) bad('Unknown collection.');
      const list = await db.col(c);
      for (const raw of recs) {
        if (!raw || typeof raw.id !== 'string') continue; let r = clean(raw);
        if (c === 'users') {
          if (r.id === 'u_admin') { const a0 = list.find(x => x.id === 'u_admin'); if (a0 && /^[a-f0-9]{64}$/.test(raw.pass || '')) { a0.pass = raw.pass; delete a0.pw; delete a0.salt; a0.name = str(raw.name, 60) || a0.name; a0.phone = str(raw.phone, 30); } continue; }
          if (list.some(x => x.email === String(r.email).toLowerCase() && x.id !== r.id)) continue;
          r = { id: r.id, name: str(r.name, 60), email: String(r.email).toLowerCase(), phone: str(r.phone, 30), role: 'user', created: r.created || now, pass: r.pass };
        }
        const i = list.findIndex(x => x.id === r.id); if (i >= 0) list[i] = { ...list[i], ...r }; else list.push(r);
      }
      db.mark(c); return { ok: 1 };
    }
    default: bad('Unknown request.', 404);
  }
}

const handler = async (req) => {
  try {
    const st = await getStores();
    const url = new URL(req.url);
    if (req.method === 'OPTIONS') return new Response(null, { status: 204, headers: CORS });
    if (req.method === 'GET') {
      if (url.searchParams.get('feed') === 'products') {
        const fdb = new DB(st.main); await init(fdb);
        const brands = await fdb.col('brands'), prods = await fdb.col('products');
        const act = new Map(brands.filter(b => b.status === 'active').map(b => [b.id, b])), only = url.searchParams.get('brand'), origin = url.origin;
        const abs = x => (x && x.startsWith('/') ? origin + x : x);
        const list = prods.filter(p => pst(p) === 'active' && act.has(p.brandId) && (!only || p.brandId === only)).map(p => ({
          id: p.id, name: p.name, price: p.price, currency: 'NGN', stock: p.stock, category: p.category, description: p.description,
          image: abs((p.images || [])[0] || ''), images: (p.images || []).map(abs), brand: act.get(p.brandId).name, brandId: p.brandId, url: origin + '/#/product/' + p.id
        }));
        return new Response(JSON.stringify({ store: 'VTX Online', url: origin, updated: Date.now(), products: list }), { headers: { 'content-type': 'application/json', 'cache-control': 'public, max-age=30', ...CORS } });
      }
      const id = url.searchParams.get('img');
      if (!id) return json({ ok: true, app: 'VTXOnline', storage: true, onlinePayments: payConfigured() });
      if (!/^[a-f0-9]{24}$/.test(id)) return new Response('Not found', { status: 404 });
      const d = await st.img.get(id, { type: 'text' });
      const m = d && d.match(/^data:(image\/[a-z]+);base64,(.+)$/);
      if (!m) return new Response('Not found', { status: 404 });
      return new Response(Buffer.from(m[2], 'base64'), { headers: { 'content-type': m[1], 'cache-control': 'public, max-age=31536000, immutable', ...CORS } });
    }
    if (req.method !== 'POST') return json({ error: 'Method not allowed' }, 405);
    const sig = req.headers.get('x-paystack-signature');
    if (sig) {
      const raw = await req.text(), key = process.env.PAYSTACK_SECRET_KEY || '';
      const good = key ? crypto.createHmac('sha512', key).update(raw).digest('hex') : '';
      if (!good || good.length !== sig.length || !crypto.timingSafeEqual(Buffer.from(good), Buffer.from(sig))) return new Response('invalid signature', { status: 401 });
      let ev = {}; try { ev = JSON.parse(raw); } catch (e) { /* ignore */ }
      if (ev.event === 'charge.success' && ev.data && typeof ev.data.reference === 'string') {
        const wdb = new DB(st.main); await init(wdb);
        try { await fulfill(wdb, ev.data.reference, null); await wdb.flush(); } catch (e) { console.error('webhook', e); }
      }
      return new Response('ok', { status: 200 });
    }
    const body = await req.json().catch(() => ({}));
    const db = new DB(st.main);
    await init(db);
    const user = await authUser(req, db);
    const out = await act(body, db, user, st);
    await db.flush();
    return json(out);
  } catch (e) {
    if (e instanceof HttpError) return json({ error: e.message }, e.status);
    console.error(e);
    return json({ error: 'Server error' }, 500);
  }
};

async function sha(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vtx:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(unescape(encodeURIComponent(p)))}}

function ph(name){let h=0;for(const c of String(name))h=(h*31+c.charCodeAt(0))%360;const t=(String(name).match(/\b\w/g)||['V']).slice(0,2).join('').toUpperCase();
 const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h},16%,90%)'/><stop offset='1' stop-color='hsl(${h},20%,74%)'/></linearGradient></defs><rect width='600' height='600' fill='url(#g)'/><text x='50%' y='56%' font-family='Arial' font-weight='700' font-size='150' fill='rgba(0,0,0,.3)' text-anchor='middle'>${t}</text></svg>`;
 return'data:image/svg+xml;utf8,'+encodeURIComponent(svg)}

function spark(a,c,w=80,h=26){if(!a||a.length<2)return'';const mn=Math.min(...a),mx=Math.max(...a)||1,d=mx-mn||1;const pts=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-2-((v-mn)/d)*(h-4)).toFixed(1)}`).join(' ');return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/></svg>`}

function compress(file,max=800,q=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

 const dpr=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
 const padL=44,padR=10,padT=10,padB=22;let all=[];on.forEach(b=>all.push(...(S.series[b.id]||[])));
 if(!all.length){x.fillStyle='#616161';x.font='13px sans-serif';x.fillText('Select a brand to see its line.',padL,H/2);return}
 let mn=Math.min(...all),mx=Math.max(...all);const m=(mx-mn)*.1||5;mn-=m;mx+=m;
 const X=i=>padL+i/(N-1)*(W-padL-padR),Y=v=>padT+(1-(v-mn)/(mx-mn))*(H-padT-padB);
 x.font='11px sans-serif';x.fillStyle='#616161';x.strokeStyle='#ececec';x.lineWidth=1;
 for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,y=Y(v);x.beginPath();x.moveTo(padL,y);x.lineTo(W-padR,y);x.stroke();x.fillText(v.toFixed(0),6,y+4)}

 on.forEach(b=>{const a=S.series[b.id];if(!a)return;const col=colorOf(b.id);
  if(on.length===1){const g=x.createLinearGradient(0,padT,0,H-padB);g.addColorStop(0,col+'33');g.addColorStop(1,col+'00');x.beginPath();a.forEach((v,i)=>i?x.lineTo(X(i+N-a.length),Y(v)):x.moveTo(X(i+N-a.length),Y(v)));x.lineTo(X(N-1),H-padB);x.lineTo(X(N-a.length),H-padB);x.closePath();x.fillStyle=g;x.fill()}
  x.beginPath();x.strokeStyle=col;x.lineWidth=2;x.lineJoin='round';a.forEach((v,i)=>i?x.lineTo(X(i+N-a.length),Y(v)):x.moveTo(X(i+N-a.length),Y(v)));x.stroke();
  x.beginPath();x.fillStyle=col;x.arc(X(N-1),Y(a[a.length-1]),3.5,0,7);x.fill()});
 c.onpointermove=e=>{const r=c.getBoundingClientRect(),px=e.clientX-r.left;let i=Math.round((px-padL)/(W-padL-padR)*(N-1));i=Math.max(0,Math.min(N-1,i));

  tip.style.display='block';tip.style.left=Math.min(Math.max(0,X(i)+12),W-150)+'px';tip.style.top='10px'};
 c.onpointerleave=()=>{$('#tip').style.display='none'};
}

function localAI(q){
 const t=q.toLowerCase().trim();
 if(/^(hi|hello|hey|good (morning|afternoon|evening))\b/.test(t))return`Hello! I am VTX AI. Ask me how anything in the app works, like selling, paying the listing fee, publishing or ordering.`;
 if(/this page|where am i|what is this|what do i do|explain (this|the page)|lost|confused|don.?t understand|help/.test(t))return(PH[route().name]||PH.home)+`\n\nAsk me anything else you want explained.`;
 let best=null,bs=0;KB.forEach(e=>{let s=0;e.k.forEach(k=>{if(t.includes(k))s+=k.split(' ').length*2+(k.length>5?1:0)});if(s>bs){bs=s;best=e}});
 if(best)return best.a();
 return`I am not sure I understood that. I can explain: selling and Create store, the listing fee, Publishing and Active, adding products, ordering and delivery, the 10% commission, discounts, the chart and connecting a store. Try one of those, or tap **Explain this page**.`;
}

 try{let msgs=AIM.slice(-10).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));while(msgs.length&&msgs[0].role!=='user')msgs.shift();
  const j=await api('ai',{messages:msgs,context:aiContext()});if(!j.reply)throw 0;AIM.push({r:'a',t:j.reply});AIon=true}

const LIVE=['Shopify','UJU Store','Other store'];
async function pullFeed(platform,url){
 let base=url.trim();if(!/^https?:\/\//.test(base))base='https://'+base;const b0=base.replace(/\/+$/,'');let list=[];
 if(platform==='Shopify'){
  let r;try{r=await fetch(b0+'/products.json?limit=30')}catch(e){throw new Error('Could not reach that store.')}
  if(!r.ok)throw new Error('Could not read that Shopify store.');const j=await r.json();
  list=(j.products||[]).slice(0,30).map(sp=>({extId:'shopify-'+sp.id,name:sp.title,price:parseFloat(sp.variants?.[0]?.price)||0,stock:20,category:CATS.includes(sp.product_type)?sp.product_type:'Other',description:(sp.body_html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,600)||sp.title,images:(sp.images||[]).slice(0,3).map(i=>i.src)}));
 }else{
  const tries=/\.json(\?|$)/i.test(b0)?[b0]:[b0+'/products.json',b0+'/api/products.json'];let j=null,used='';
  for(const t of tries){try{const r=await fetch(t);if(!r.ok)continue;j=await r.json();used=t;break}catch(e){}}
  if(!j)throw new Error('Could not find a products.json feed at that address.');
  const arr=Array.isArray(j)?j:(j.products||j.items||j.data||[]);
  list=arr.slice(0,60).map(p=>{const name=String(p.name||p.title||'').trim();
   const imgs=[].concat(p.images||p.image||p.img||p.photo||p.picture||[]).map(x=>typeof x==='string'?x:(x&&(x.src||x.url))||'').filter(Boolean).map(x=>{try{return new URL(x,used).href}catch(e){return''}}).filter(x=>/^https:/.test(x)).slice(0,4);
   const st=p.stock??p.quantity;
   return{extId:'feed-'+String(p.id??p.sku??name.toLowerCase()),name,price:parseFloat(String(p.price??p.amount??p.cost??p.variants?.[0]?.price??'0').replace(/[^\d.]/g,''))||0,stock:Number.isFinite(+st)&&st!==undefined&&st!==null&&st!==''?+st:20,category:CATS.includes(p.category)?p.category:'Other',description:String(p.description||p.desc||p.body_html||name).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,600)||name,images:imgs}}).filter(p=>p.name&&p.price>0);
 }
 if(!list.length)throw new Error('No products were found in that feed.');
 return list}

function demoPaystack(){if(window.PaystackPop&&window.PaystackPop.demo)return;window.PaystackPop={demo:1,setup:function(o){return{openIframe:function(){window.__demoPay=o;setTimeout(function(){openModal('Demo payment','<p>This is a <b>simulated</b> payment window for preview mode. No money moves.</p><p class="b" style="font-size:22px;margin:10px 0">'+money(o.amount/100)+'</p>','<button class="btn" data-a="demopayno">Cancel</button><button class="btn p" data-a="demopayok">Simulate successful payment</button>')},200)}}}}}
function loadPaystack(){if(window.__DEMO){demoPaystack();return Promise.resolve()}return new Promise((res,rej)=>{if(window.PaystackPop)return res();const sc=document.createElement('script');sc.src='https://js.paystack.co/v1/inline.js';sc.onload=()=>res();sc.onerror=()=>rej(new Error('Could not load the payment window. Check your connection and try again.'));document.head.appendChild(sc)})}
async function payNow(o,kind){
 await loadPaystack();
 await new Promise(resolve=>{let done=false;
  const h=PaystackPop.setup({key:S.settings.paystackKey,email:o.email,amount:Math.round(o.amount*100),currency:'NGN',ref:o.reference,
   callback:function(r){done=true;confirmPay(o.reference,kind).then(resolve)},
   onClose:function(){if(!done){toast(kind==='fee'?'Payment window closed. Tap Pay when you are ready.':'Payment window closed. You can pay from Orders.');resolve()}}});
  h.openIframe()})}
async function confirmPay(ref,kind){try{toast('Confirming your payment…');const j=await api(kind==='fee'?'fee.verify':'order.verify',{reference:ref});await sync(true);toast(j.paid?(kind==='fee'?'Payment received. Your store is publishing.':'Payment received. Thank you!'):(j.error||'We have not received the payment yet. This page updates by itself once it is confirmed.'),!j.paid)}catch(e){toast(e.message,1)}}

let TOKEN=localStorage.getItem('vtx_token')||'',VER=0,LOADED=false,SYNCERR='',RATE=0,SYNCING=false;
function setToken(t){TOKEN=t;if(t)localStorage.setItem('vtx_token',t);else localStorage.removeItem('vtx_token')}
async function api(a,body={}){
 let r;try{r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json',...(TOKEN?{authorization:'Bearer '+TOKEN}:{})},body:JSON.stringify({a,...body})})}catch(e){throw new Error('No internet connection. Try again.')}
 let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&TOKEN&&a!=='login'){setToken('');S.session=null}
 if(!r.ok)throw new Error(j.error||(r.status===404?'The server part (netlify/functions/api.mjs) is not deployed on this site. GitHub Pages cannot run it, so deploy the repository with Netlify.':'Server error ('+r.status+')'));
 return j}
async function safe(fn){try{return await fn()}catch(e){toast(e.message||'Something went wrong',1)}}
async function sync(force){
 if(SYNCING&&!force)return;SYNCING=true;
 try{const j=await api('state',{v:force?0:VER});SYNCERR='';if(j.same)return;VER=j.v;applyState(j,force)}
 catch(e){if(!LOADED){SYNCERR=e.message;renderBoot()}}
 finally{SYNCING=false}}
function applyState(j,force){
 const st=j.state,prev=S.orders||[],first=!LOADED;
 ['users','brands','products','orders','payments','connections','discounts'].forEach(k=>S[k]=st[k]||[]);
 S.settings=st.settings;S.wd=st.wd||0;S.series=st.series||{};S.session=st.me||null;
 S.brands.forEach(b=>{if(b.id==='b_vtx'&&!b.logo)b.logo=LOGO});
 LOADED=true;
 if(S.session&&!me()){S.session=null}
 if(UI.splash)return;
 const pc=pendingCount();document.title=(pc?`(${pc}) `:'')+'VTXOnline Shopping';
 notifyNew(prev,first);
 const r=route().name,ae=document.activeElement,typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
 const sig=JSON.stringify([myBrand()?.status,S.products.filter(p=>myBrand()&&p.brandId===myBrand().id).map(p=>p.status)]);
 const sigChanged=sig!==UI.sig;UI.sig=sig;
 if(force||first){render();return}
 if(r==='chart'){paintChart();return}
 if($('#modal').innerHTML||typing)return;
 if(['checkout','auth'].includes(r))return;
 if(r==='store'&&!sigChanged)return;
 render();
}
function notifyNew(prev,first){
 const u=me();if(!u)return;const mb=myBrand();
 if(isAdmin()){const n=S.payments.filter(p=>p.status==='pending').length;if(!first&&n>(UI.pp||0))toast('New brand listing payment to review');UI.pp=n}
 if(first)return;
 const pm=new Map(prev.map(o=>[o.id,o.status]));
 const paid=S.orders.filter(o=>o.status==='paid'&&pm.get(o.id)!=='paid'&&o.buyerId!==u.id&&(isAdmin()||(mb&&o.brandId===mb.id)));
 if(paid.length)toast(`New paid order ${paid[0].id} · ${money(paid[0].subtotal)}${paid.length>1?` (+${paid.length-1} more)`:''}`);
}
function renderBoot(){
 $('#app').innerHTML=SYNCERR?`<div class="authw"><div class="authc"><div class="lg0"><img src="${LOGO}" alt=""></div><div class="card"><h2>Can't reach the server</h2><p class="mut" style="margin:6px 0 12px">${esc(SYNCERR)}</p><button class="btn p full" data-a="retry">Try again</button><button class="btn full" style="margin-top:10px" data-a="preview">Preview without server</button><p class="hint" style="margin-top:6px">Preview runs only on this device with practice data. It is not your real store.</p><p class="hint" style="margin-top:12px">To test the server, open <a href="/api" target="_blank" rel="noopener">${esc(location.host)}/api</a> in your browser. It should show <b>"ok":true</b>.</p></div></div></div>`
 :`<div class="authw"><div class="authc" style="text-align:center"><div class="lg0"><img class="logo-anim" src="${LOGO}" alt="VTX"></div><p class="mut"><i class="spin"></i> Loading VTXOnline…</p></div></div>`}
function pollLoop(){const mb=myBrand();const busy=(mb&&['publishing','pending'].includes(mb.status))||(mb&&S.products.some(p=>p.brandId===mb.id&&p.status==='publishing'));
 setTimeout(async()=>{if(!document.hidden)await sync(false);pollLoop()},busy?2000:6000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(false)});
async function loadRate(){try{const c=store.get('rate',null);if(c&&Date.now()-c.t<6*36e5){RATE=c.r;return}const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();if(j.rates&&j.rates.NGN){RATE=j.rates.NGN;store.set('rate',{r:RATE,t:Date.now()})}}catch(e){const c=store.get('rate',null);if(c)RATE=c.r}}
const usdRate=()=>(S.settings&&S.settings.usdRate>0)?S.settings.usdRate:(RATE||1500);
const usd=n=>'≈ $'+(n/usdRate()).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
async function uploadData(d){return(await api('upload',{d})).url}
async function prep(file,max,q){toast('Uploading photo…');return uploadData(await compress(file,max,q))}
const hasLocal=()=>!!localStorage.getItem('vtx_products')&&!localStorage.getItem('vtx_migrated');
function migBanner(){return isAdmin()&&hasLocal()?`<div class="ban wa"><div class="grow"><b>Your old products and orders are still only on this phone.</b> Move them to the shared server so everyone can see them.</div><button class="btn p sm" data-a="migrate">Move now</button></div>`:''}
async function migrateLocal(){
 if(!confirm('Move the brands, products, orders and accounts saved on this phone to the shared server?'))return;
 await safe(async()=>{
  const cache=new Map();
  const fix=async v=>{if(typeof v==='string'&&v.startsWith('data:image')){if(!cache.has(v))cache.set(v,await uploadData(v));return cache.get(v)}return v};
  const conv=async o=>{const r={...o};for(const k of ['logo','banner','proof'])if(r[k])r[k]=await fix(r[k]);if(Array.isArray(r.images)){const im=[];for(const x of r.images)im.push(await fix(x));r.images=im}return r};
  let n=0;
  for(const c of ['brands','products','users','orders','payments','discounts','connections']){
   const recs=store.get(c,[]);
   for(let i=0;i<recs.length;i+=15){const chunk=[];for(const r of recs.slice(i,i+15))chunk.push(await conv(r));await api('migrate',{c,recs:chunk});n+=chunk.length;toast('Moving data… '+n)}}
  const st=store.get('settings',null);if(st)await api('migrate',{c:'settings',recs:[st]});
  localStorage.setItem('vtx_migrated','1');await sync(true);toast('Done. Your data is on the shared server.')})}

/* ---------- actions ---------- */
const A={
 retry(){SYNCERR='';renderBoot();sync(true)},
 migrate(){migrateLocal()},
 ai(){AIopen=!AIopen;drawAI()},
 aiq(a){askAI(a.dataset.q)},
 aigo(a){const h=a.dataset.h;if(/^#\/[a-z0-9\/_-]*$/i.test(h)){if(innerWidth<=900){AIopen=false;drawAI()}go(h)}},
 newdisc(){openModal('Create discount',`<form id="df" data-f="disc"><label class="f"><span>Discount code</span><input class="in" name="code" required maxlength="20" pattern="[A-Za-z0-9]+" placeholder="e.g. WELCOME10"><div class="hint">Letters and numbers only.</div></label><label class="f"><span>Percentage off</span><input class="in" name="percent" type="number" min="1" max="90" required></label></form>`,`<button class="btn" data-a="closem">Cancel</button><button class="btn p" type="submit" form="df">Create</button>`)},
 dtog(a){safe(async()=>{await api('disc.toggle',{id:a.dataset.id});await sync(true)})},
 ddel(a){safe(async()=>{await api('disc.del',{id:a.dataset.id});await sync(true)})},
 applycode(){const f=$('#co');UI.draft={};new FormData(f).forEach((v,k)=>UI.draft[k]=v);const c=$('#codein').value.trim().toUpperCase();if(!c){UI.code=null;return render()}
  safe(async()=>{const j=await api('code',{code:c,brandIds:cartLines().map(x=>x.p.brandId)});if(!j.discount){UI.code=null;toast('That code is not valid for the items in your cart.',1)}else{UI.code=j.discount;toast(j.discount.percent+'% off applied')}render()})},
 closem(a,e){if(a.classList.contains('ov')&&e.target!==a)return;closeModal()},
 tosign(){UI.amode='in'},
 amode(a){UI.amode=a.dataset.v;render()},
 mtab(a){UI.mtab=a.dataset.v;render()},
 cat(a){UI.cat=a.dataset.v;render()},
 otab(a){UI.otab=a.dataset.v;render()},
 payfee(){safe(async()=>{const j=await api('fee.init');if(j.free){await sync(true);return}await payNow({reference:j.reference,amount:j.amount,email:j.email},'fee')})},
 repay(a){const ref=a.dataset.ref,os=S.orders.filter(o=>o.payRef===ref);if(!os.length)return;const amt=os.reduce((t,o)=>t+o.subtotal,0);safe(()=>payNow({reference:ref,amount:amt,email:me().email},'order'))},
 demopayok(){const o=window.__demoPay;closeModal();if(o)setTimeout(()=>o.callback({reference:o.ref}),100)},
 demopayno(){const o=window.__demoPay;closeModal();if(o&&o.onClose)o.onClose()},
 preview(){installDemo();SYNCERR='';VER=0;LOADED=false;renderBoot();sync(true)},
 atab(a){UI.atab=a.dataset.v;if(UI.atab==='withdrawals')loadWd();render()},
 wm(a){const v=a.dataset.v;$('#wmeth').value=v;$('#wb').hidden=v!=='bank';$('#wc').hidden=v!=='crypto';document.querySelectorAll('#wb input,#wc input,#wc select').forEach(i=>{i.disabled=i.closest('#wb')?v!=='bank':v!=='crypto'});document.querySelectorAll('.wmc').forEach(c=>c.classList.toggle('on',c.dataset.v===v))},
 withdraw(){openWithdraw()},
 wact(a){const id=a.dataset.id,v=a.dataset.v;let txref='';if(v==='paid'){txref=prompt('Enter the transaction reference or hash of the payment you sent:');if(txref===null)return}else if(!confirm('Reject this withdrawal? The money returns to their balance.'))return;safe(async()=>{await api('wallet.act',{id,v,txref});await loadWd();await sync(true);toast('Withdrawal updated')})},
 tog(a){const i=a.dataset.id;UI.hidden=UI.hidden.includes(i)?UI.hidden.filter(x=>x!==i):[...UI.hidden,i];paintChart()},
 copy(a){navigator.clipboard?.writeText(a.dataset.v).then(()=>toast('Copied'),()=>toast('Copy failed',1))},
 pimg(a){const i=+a.dataset.i;const p=S.products.find(x=>x.id===route().id);$('#pmain').src=p.images[i];document.querySelectorAll('.thumbs img').forEach((im,k)=>im.classList.toggle('on',k===i))},
 pq(a){const el=$('#pq');el.textContent=Math.max(1,+el.textContent+ +a.dataset.v)},
 add(a){const p=S.products.find(x=>x.id===a.dataset.id);const q=a.dataset.q?+$('#pq').textContent:1;addCart(p,q);toast('Added to cart');render()},
 buynow(a){const p=S.products.find(x=>x.id===a.dataset.id);addCart(p,+$('#pq').textContent);go('#/checkout')},
 cq(a){const c=S.cart.find(x=>x.pid===a.dataset.id),p=S.products.find(x=>x.id===a.dataset.id);c.qty=Math.max(1,Math.min(p.stock,c.qty+ +a.dataset.v));persist('cart');render()},
 crm(a){S.cart=S.cart.filter(x=>x.pid!==a.dataset.id);persist('cart');render()},
 tocheckout(){if(!me()){UI.next='#/checkout';UI.amode='in';toast('Sign in to place your order.');go('#/auth')}else go('#/checkout')},
 geo(){const st=$('#geost');if(!navigator.geolocation){st.textContent='Location is not available on this device.';return}st.textContent='Getting your location…';navigator.geolocation.getCurrentPosition(p=>{const f=$('#co');f.lat.value=p.coords.latitude.toFixed(6);f.lng.value=p.coords.longitude.toFixed(6);st.textContent='Location added to your order.'},()=>{st.textContent='Could not get your location. Fill in the address instead.'},{timeout:10000})},
 async logout(){setToken('');S.session=null;await sync(true);toast('Signed out');go('#/home')},
 ord(a){const id=a.dataset.id,v=a.dataset.v;if(v==='cancel'&&!confirm('Cancel this order?'))return;safe(async()=>{await api('order.act',{id,v});await sync(true);toast('Order updated')})},
 newp(){openProduct()},editp(a){openProduct(a.dataset.id)},
 rmimg(a){pImgs.splice(+a.dataset.i,1);drawThumbs()},
 delp(a){if(!confirm('Delete this product?'))return;const id=a.dataset.id;safe(async()=>{await api('product.delete',{id});S.cart=S.cart.filter(c=>c.pid!==id);persist('cart');await sync(true)})},
 pay(a){const id=a.dataset.id,v=a.dataset.v;safe(async()=>{await api('pay.act',{id,v});await sync(true);toast(v==='approve'?'Approved. The store is publishing.':'Payment rejected')})},
 bst(a){const id=a.dataset.id,v=a.dataset.v;safe(async()=>{await api('brand.admin',{id,v});await sync(true)})},
 bdel(a){if(!confirm('Delete this brand and its products?'))return;const id=a.dataset.id;safe(async()=>{await api('brand.admin',{id,v:'delete'});await sync(true)})},
 conn(a){const n=a.dataset.v,mb=myBrand(),live=LIVE.includes(n),pre=n==='UJU Store'?'https://veltexglobalapp-ui.github.io/Uju-store/':'';
  openModal('Connect '+n,`<form id="cf" data-f="conn"><input type="hidden" name="platform" value="${n}">${live&&!(mb&&mb.status==='active')?`<div class="ban wa"><div>Open and activate your store first, then import products.</div></div>`:''}<label class="f"><span>Store link</span><input class="in" name="url" required value="${pre}" placeholder="${n==='Shopify'?'your-store.myshopify.com':'https://your-store.com'}"></label><p class="hint">${n==='Shopify'?'Public products are imported into your store. Prices are copied as numbers, so check them after import.':live?'We read the store\'s products.json feed and add each product to your store. Products need a photo, a price above 0 and a description to go live. Tap Sync now later to refresh them.':'Your request is saved and the admin will set up the sync with you.'}</p></form>`,`<button class="btn" data-a="closem">Cancel</button><button class="btn p" type="submit" form="cf">Connect</button>`)},
 csync(a){const c=S.connections.find(x=>x.id===a.dataset.id);if(!c)return;safe(async()=>{toast('Syncing…');const products=await pullFeed(c.platform,c.url);const r=await api('product.import',{products,source:c.platform});await sync(true);toast(r.count+' products synced. Changes go live in a few seconds.')})},
 cdel(a){const id=a.dataset.id;safe(async()=>{await api('conn.del',{id});await sync(true)})},
 export(){const d={...S};delete d.cart;const bl=new Blob([JSON.stringify(d)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='vtxonline-backup.json';l.click()}
};
function addCart(p,q=1){const c=S.cart.find(x=>x.pid===p.id);const n=Math.min(p.stock,(c?c.qty:0)+q);if(c)c.qty=n;else S.cart.push({pid:p.id,qty:n});persist('cart')}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const f=A[a.dataset.a];if(f)f(a,e)});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.dataset.c==='sort'){UI.sort=t.value;$('#grid').innerHTML=gridHtml()}
 try{
 if(t.id==='pfiles'){for(const f of [...t.files].slice(0,4-pImgs.length))pImgs.push(await prep(f,800,.72));drawThumbs();t.value=''}
 if(t.id==='logof'&&t.files[0]){logoDraft=await prep(t.files[0],300,.85);$('#logoprev').innerHTML=`<img class="thumb" style="width:64px;height:64px;margin-top:8px;object-fit:contain" src="${logoDraft}" alt="">`}
 if(t.id==='bannerf'&&t.files[0]){bannerDraft=await prep(t.files[0],1200,.7);$('#bannerprev').innerHTML=`<img class="thumb" style="width:120px;height:48px;margin-top:8px" src="${bannerDraft}" alt="">`}
 if(t.id==='prooff'&&t.files[0]){proofDraft=await prep(t.files[0],900,.6);$('#proofprev').innerHTML=`<img class="proof" src="${proofDraft}" alt="">`}
 }catch(err){toast(err.message||'That photo could not be used.',1)}
});
document.addEventListener('input',e=>{if(e.target.id==='q'&&route().name==='market'){UI.q=e.target.value;const g=$('#grid');if(g)g.innerHTML=gridHtml()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(AIopen){AIopen=false;drawAI()}}});

const F={
 withdraw(f,d){return safe(async()=>{const m=d.get('method');await api('wallet.withdraw',{amount:+d.get('amount'),method:m,bank:{bankName:d.get('bankName'),accountName:d.get('accountName'),accountNumber:d.get('accountNumber')},wallet:{network:d.get('network'),address:(d.get('address')||'').trim()},rate:usdRate()});closeModal();UI.wAt=0;await loadWallet();toast('Withdrawal requested. The admin will send it soon.')})},
 ai(f,d){const t=(d.get('q')||'').trim().slice(0,400);if(t)askAI(t)},
 search(f){UI.q=$('#q').value;UI.mtab='products';go('#/market')},
 disc(f,d){return safe(async()=>{await api('disc.save',{code:d.get('code'),percent:+d.get('percent')});closeModal();await sync(true);toast('Discount created')})},
 storeset(f,d){return safe(async()=>{await api('brand.save',{name:d.get('name'),tagline:d.get('tagline'),description:d.get('description'),announce:d.get('announce'),whatsapp:d.get('whatsapp'),logo:logoDraft,banner:bannerDraft});logoDraft=null;bannerDraft=null;await sync(true);toast('Store saved')})},
 signin(f,d){return safe(async()=>{const j=await api('login',{email:d.get('email').trim().toLowerCase(),pass:await sha(d.get('password'))});setToken(j.token);await sync(true);toast('Welcome back, '+(me()?.name||'').split(' ')[0]);const n=UI.next||'#/home';UI.next='#/home';go(n)})},
 signup(f,d){return safe(async()=>{const j=await api('signup',{name:d.get('name').trim(),email:d.get('email').trim().toLowerCase(),phone:d.get('phone').trim(),pass:await sha(d.get('password'))});setToken(j.token);await sync(true);toast('Account created');const n=UI.next||'#/home';UI.next='#/home';go(n)})},
 profile(f,d){return safe(async()=>{await api('profile',{name:d.get('name'),phone:d.get('phone'),email:d.get('email')||''});await sync(true);toast('Profile saved')})},
 pass(f,d){return safe(async()=>{await api('password',{old:await sha(d.get('old')),new:await sha(d.get('new'))});f.reset();toast('Password updated')})},
 acct(f,d){return safe(async()=>{await api('settings',{account:{name:d.get('name'),bank:d.get('bank'),number:d.get('number')},minWithdraw:+d.get('minw')||0,fee:+d.get('fee'),commission:Math.min(1,Math.max(0,+d.get('comm')/100)),usdRate:+d.get('usd')||0});await sync(true);toast('Platform settings saved')})},
 brand(f,d){return safe(async()=>{await api('brand.create',{name:d.get('name'),category:d.get('category'),description:d.get('description'),logo:logoDraft||''});logoDraft=null;await sync(true);toast(isAdmin()?'Brand created':'Brand created. Now pay the listing fee.')})},
 paylist(f,d){return safe(async()=>{await api('pay.submit',{ref:d.get('ref'),proof:proofDraft||''});proofDraft=null;await sync(true);toast('Payment submitted for review')})},
 product(f,d){return safe(async()=>{await api('product.save',{id:d.get('id')||'',data:{name:d.get('name'),price:+d.get('price'),stock:+d.get('stock'),category:d.get('category'),description:d.get('description'),images:[...pImgs]}});closeModal();await sync(true);toast('Saved. Publishing your product…')})},
 checkout(f,d){return safe(async()=>{const L=cartLines();if(!L.length)return;if(!S.settings.payOn)throw new Error('Online payment is not set up yet. Please try again later.');
  const ship={name:d.get('name'),phone:d.get('phone'),address:d.get('address'),city:d.get('city'),state:d.get('state'),landmark:d.get('landmark'),lat:d.get('lat'),lng:d.get('lng')};
  const j=await api('order.create',{items:L.map(x=>({pid:x.c.pid,qty:x.c.qty})),ship,code:UI.code?UI.code.code:''});
  UI.code=null;UI.draft=null;S.cart=[];persist('cart');UI.otab='mine';await sync(true);go('#/orders');
  await payNow({reference:j.reference,amount:j.total,email:me().email},'order')})},
 conn(f,d){return safe(async()=>{const platform=d.get('platform'),url=d.get('url').trim();let status='requested',count=0;
  if(LIVE.includes(platform)){const mb=myBrand();if(!mb||mb.status!=='active')throw new Error('Open and activate your store first, then import products.');
   try{toast('Importing products…');const products=await pullFeed(platform,url);const r2=await api('product.import',{products,source:platform});status='imported';count=r2.count}
   catch(e){if(platform!=='Other store')throw e;toast(e.message+' Request saved for the admin.',1)}}
  await api('conn.add',{platform,url,status,count});closeModal();await sync(true);toast(status==='imported'?count+' products imported. They go live in a few seconds.':'Connection request saved')})}
};
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
 const btn=f.querySelector('[type=submit]')||(f.id?document.querySelector(`[form="${f.id}"]`):null);if(btn)btn.disabled=true;
 try{await F[f.dataset.f]?.(f,new FormData(f))}finally{if(btn)btn.disabled=false}});

/* ---------- start ---------- */
(async()=>{load();if(!location.hash)location.hash='#/home';renderBoot();
 addEventListener('resize',()=>{if(route().name==='chart')paintChart()});
 UI.splash=true;await Promise.all([sync(true),new Promise(r=>setTimeout(r,1500))]);UI.splash=false;if(LOADED)render();drawAI();pollLoop();
 loadRate().then(()=>{if(LOADED&&!['checkout','auth'].includes(route().name)&&!$('#modal').innerHTML)render()})})();
</script>
